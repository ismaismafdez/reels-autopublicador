name: Publicar Reel

on:
  schedule:
    # UTC. Cubre horario de verano (UTC+2) e invierno (UTC+1); el script decide
    # si toca publicar según config.json y evita duplicados con estado.json.
    - cron: "7 6,7,19,20 * * *"
  workflow_dispatch:
    inputs:
      forzar:
        description: "Publicar ya, ignorando la franja horaria"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Publicar
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
          FORZAR: ${{ inputs.forzar }}
        run: python scripts/publicar.py

      - name: Guardar estado
        if: always()
        run: |
          git config user.name "reels-bot"
          git config user.email "reels-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "estado: $(date -u +%F_%H%M)"
          git pull --rebase
          git push
